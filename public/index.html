<!DOCTYPE html>
<html lang="zh-CN">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>炫酷的Go HTTP服务</title>
	<style>
		* {
			margin: 0;
			padding: 0;
			box-sizing: border-box;
		}
		
		body {
			font-family: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
			color: white;
			display: flex;
			flex-direction: column;
			align-items: center;
			justify-content: center;
			height: 100vh;
			overflow: hidden;
			background: linear-gradient(-45deg, #ee7752, #e73c7e, #23a6d5, #23d5ab);
			background-size: 400% 400%;
			animation: gradient 15s ease infinite;
		}
		
		@keyframes gradient {
			0% {
				background-position: 0% 50%;
			}
			50% {
				background-position: 100% 50%;
			}
			100% {
				background-position: 0% 50%;
			}
		}
		
		.container {
			text-align: center;
			padding: 3rem;
			border-radius: 20px;
			background: rgba(255, 255, 255, 0.1);
			backdrop-filter: blur(10px);
			box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.37);
			border: 1px solid rgba(255, 255, 255, 0.18);
			max-width: 700px;
			width: 90%;
			z-index: 1;
		}
		
		h1 {
			font-size: 4rem;
			margin-bottom: 1.5rem;
			font-weight: 800;
			text-transform: uppercase;
			background: linear-gradient(to right, #fff, #f8f8f8, #ffffff);
			background-size: 200% auto;
			color: transparent;
			background-clip: text;
			-webkit-background-clip: text;
			animation: textGlow 3s ease-in-out infinite, textFloat 5s ease-in-out infinite;
			text-shadow: 0 0 10px rgba(255,255,255,0.5), 0 0 20px rgba(255,255,255,0.3);
		}
		
		@keyframes textGlow {
			0% {
				text-shadow: 0 0 10px #fff, 0 0 20px #ff00cc, 0 0 30px #ff00cc;
			}
			50% {
				text-shadow: 0 0 20px #fff, 0 0 30px #3333ff, 0 0 40px #3333ff;
			}
			100% {
				text-shadow: 0 0 10px #fff, 0 0 20px #ff00cc, 0 0 30px #ff00cc;
			}
		}
		
		@keyframes textFloat {
			0%, 100% {
				transform: translateY(0);
			}
			50% {
				transform: translateY(-10px);
			}
		}
		
		p {
			font-size: 1.4rem;
			margin-bottom: 2.5rem;
			line-height: 1.6;
			text-shadow: 0 1px 3px rgba(0, 0, 0, 0.3);
			animation: fadeIn 1s ease-in-out;
		}
		
		@keyframes fadeIn {
			from {
				opacity: 0;
				transform: translateY(20px);
			}
			to {
				opacity: 1;
				transform: translateY(0);
			}
		}
		
		.btn-group {
			display: flex;
			gap: 1.5rem;
			flex-wrap: wrap;
			justify-content: center;
		}
		
		.btn {
			display: inline-block;
			padding: 1.2rem 2.8rem;
			font-size: 1.1rem;
			font-weight: bold;
			color: white;
			border: none;
			border-radius: 50px;
			cursor: pointer;
			text-decoration: none;
			transition: all 0.3s ease;
			position: relative;
			z-index: 1;
			box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
			animation: buttonPop 0.5s ease-out;
		}
		
		@keyframes buttonPop {
			0% {
				transform: scale(0.8);
				opacity: 0;
			}
			70% {
				transform: scale(1.05);
			}
			100% {
				transform: scale(1);
				opacity: 1;
			}
		}
		
		.btn::before {
			content: '';
			position: absolute;
			top: 0;
			left: -100%;
			width: 100%;
			height: 100%;
			background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
			animation: shine 3s infinite;
			z-index: -1;
		}
		
		@keyframes shine {
			0% {
				left: -100%;
			}
			100% {
				left: 100%;
			}
		}
		
		.btn-primary {
			background: linear-gradient(45deg, #ff6b6b, #ee5a6f);
		}
		
		.btn-secondary {
			background: linear-gradient(45deg, #4facfe, #00f2fe);
		}
		
		.btn:hover {
			transform: translateY(-5px) scale(1.05);
			box-shadow: 0 8px 25px rgba(0, 0, 0, 0.4);
		}
		
		.btn:active {
			transform: translateY(-2px) scale(0.98);
			box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
		}
		
		/* 装饰元素 */
		.shapes {
			position: absolute;
			width: 100%;
			height: 100%;
			top: 0;
			left: 0;
			z-index: 0;
			pointer-events: none;
		}
		
		.shape {
			position: absolute;
			border-radius: 50%;
			background: rgba(255, 255, 255, 0.1);
			backdrop-filter: blur(5px);
			animation: float 15s ease-in-out infinite;
		}
		
		.shape1 {
			top: -100px;
			left: -100px;
			width: 400px;
			height: 400px;
			background: rgba(255, 107, 107, 0.15);
			animation-delay: 0s;
		}
		
		.shape2 {
			top: 30%;
			right: -200px;
			width: 500px;
			height: 500px;
			background: rgba(79, 172, 254, 0.15);
			animation-delay: -2s;
			animation-direction: reverse;
		}
		
		.shape3 {
			bottom: -150px;
			left: 20%;
			width: 450px;
			height: 450px;
			background: rgba(255, 235, 59, 0.15);
			animation-delay: -5s;
		}
		
		.shape4 {
			top: 60%;
			right: 25%;
			width: 250px;
			height: 250px;
			background: rgba(156, 39, 176, 0.15);
			animation-delay: -8s;
			animation-direction: reverse;
		}
		
		@keyframes float {
			0%, 100% {
				transform: translate(0, 0) rotate(0deg);
			}
			25% {
				transform: translate(30px, 30px) rotate(5deg);
			}
			50% {
				transform: translate(0, 60px) rotate(10deg);
			}
			75% {
				transform: translate(-30px, 30px) rotate(5deg);
			}
		}
		
		/* 脉冲效果 */
		.pulse-container {
			position: absolute;
			width: 100%;
			height: 100%;
			top: 0;
			left: 0;
			z-index: -1;
			display: flex;
			align-items: center;
			justify-content: center;
		}
		
		.pulse {
			width: 600px;
			height: 600px;
			border-radius: 50%;
			background: radial-gradient(circle, rgba(255,255,255,0.1) 0%, rgba(255,255,255,0) 70%);
			animation: pulse 4s ease-out infinite;
		}
		
		.pulse:nth-child(2) {
			animation-delay: 1s;
		}
		
		.pulse:nth-child(3) {
			animation-delay: 2s;
		}
		
		@keyframes pulse {
			0% {
				transform: scale(0.3);
				opacity: 0.7;
			}
			100% {
				transform: scale(2);
				opacity: 0;
			}
		}
		
		/* 响应式设计 */
		@media (max-width: 768px) {
			h1 {
				font-size: 2.5rem;
			}
			
			p {
				font-size: 1.2rem;
			}
			
			.container {
				padding: 2rem;
			}
			
			.btn {
				padding: 1rem 2.2rem;
			}
			
			.btn-group {
				gap: 1rem;
			}
		}
	</style>
</head>
<body>
	<!-- 装饰元素 -->
	<div class="shapes">
		<div class="shape shape1"></div>
		<div class="shape shape2"></div>
		<div class="shape shape3"></div>
		<div class="shape shape4"></div>
	</div>
	
	<!-- 脉冲效果 -->
	<div class="pulse-container">
		<div class="pulse"></div>
		<div class="pulse"></div>
		<div class="pulse"></div>
	</div>
	
	<!-- 主内容 -->
	<div class="container">
		<h1>Go HTTP服务</h1>
		<p>欢迎使用由Go语言构建的高性能HTTP服务！体验炫酷的视觉效果和流畅的交互体验。</p>
		<div class="btn-group">
			<button class="btn btn-primary">开始探索</button>
			<button class="btn btn-secondary">了解更多</button>
		</div>
	</div>
	
	<!-- 简单的JavaScript交互 -->
	<script>
		// 为按钮添加点击效果
		function setupButtonEffects() {
			var buttons = document.querySelectorAll('.btn');
			for (var i = 0; i < buttons.length; i++) {
				buttons[i].onclick = function() {
					// 按钮点击效果
					this.style.transform = 'translateY(-2px) scale(0.98)';
					setTimeout(function() {
						this.style.transform = 'translateY(-5px) scale(1.05)';
					}, 100);
					
					// 简单的彩虹按钮效果
					var colors = [
						'linear-gradient(45deg, #ff6b6b, #ee5a6f)',
						'linear-gradient(45deg, #4facfe, #00f2fe)',
						'linear-gradient(45deg, #fa709a, #fee140)',
						'linear-gradient(45deg, #a8edea, #fed6e3)',
						'linear-gradient(45deg, #84fab0, #8fd3f4)',
						'linear-gradient(45deg, #f093fb, #f5576c)'
					];
					var randomIndex = Math.floor(Math.random() * colors.length);
					this.style.background = colors[randomIndex];
				};
			}
		}
		
		// 容器悬停效果
		function setupContainerEffects() {
			var container = document.querySelector('.container');
			container.onmouseover = function() {
				this.style.transform = 'perspective(1000px) rotateX(5deg) translateY(-10px)';
				this.style.transition = 'transform 0.5s ease';
			};
			container.onmouseout = function() {
				this.style.transform = 'perspective(1000px) rotateX(0deg) translateY(0)';
			};
		}
		
		// 初始化效果
		function initEffects() {
			setupButtonEffects();
			setupContainerEffects();
		}
		
		// 页面加载完成后初始化
		window.onload = function() {
			initEffects();
		};
	</script>
</body>
</html>
