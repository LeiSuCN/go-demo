<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>学生信息管理系统</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
        }
        .sidebar {
            width: 240px;
            background: rgba(255,255,255,0.15);
            backdrop-filter: blur(20px);
            padding: 30px 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .sidebar a {
            color: white;
            text-decoration: none;
            padding: 12px 16px;
            border-radius: 12px;
            font-size: 15px;
            transition: background 0.2s;
        }
        .sidebar a:hover { background: rgba(255,255,255,0.2); }
        .main {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .card {
            background: rgba(255,255,255,0.2);
            backdrop-filter: blur(20px);
            border-radius: 20px;
            padding: 48px;
            text-align: center;
            color: white;
        }
        .card h1 { font-size: 36px; margin-bottom: 12px; }
        .card p { font-size: 18px; opacity: 0.85; }
    </style>
</head>
<body>
    <nav class="sidebar">
        <a href="/">首页</a>
        <a href="/add.html">添加学生</a>
        <a href="/list.html">学生列表</a>
    </nav>
    <div class="main">
        <div class="card">
            <h1>学生信息管理系统</h1>
            <p>使用侧边栏导航管理学生数据</p>
        </div>
    </div>
</body>
</html>
