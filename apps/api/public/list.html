<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>学生列表</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
        }
        .sidebar {
            width: 240px;
            background: rgba(255,255,255,0.15);
            backdrop-filter: blur(20px);
            padding: 30px 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .sidebar a {
            color: white;
            text-decoration: none;
            padding: 12px 16px;
            border-radius: 12px;
            font-size: 15px;
            transition: background 0.2s;
        }
        .sidebar a:hover { background: rgba(255,255,255,0.2); }
        .main {
            flex: 1;
            padding: 40px;
        }
        .card {
            background: rgba(255,255,255,0.2);
            backdrop-filter: blur(20px);
            border-radius: 20px;
            padding: 32px;
            color: white;
        }
        .card h2 { margin-bottom: 20px; }
        table {
            width: 100%;
            border-collapse: collapse;
        }
        th, td {
            text-align: left;
            padding: 12px 16px;
            border-bottom: 1px solid rgba(255,255,255,0.2);
        }
        th { font-size: 13px; opacity: 0.7; text-transform: uppercase; }
        .search-box {
            margin-bottom: 20px;
            display: flex;
            gap: 10px;
        }
        .search-box input {
            flex: 1;
            padding: 10px 14px;
            border: none;
            border-radius: 10px;
            font-size: 15px;
            outline: none;
        }
        .search-box button {
            padding: 10px 20px;
            background: white;
            color: #667eea;
            border: none;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <nav class="sidebar">
        <a href="/">首页</a>
        <a href="/add.html">添加学生</a>
        <a href="/list.html">学生列表</a>
    </nav>
    <div class="main">
        <div class="card">
            <h2>学生列表</h2>
            <div class="search-box">
                <input type="text" id="searchId" placeholder="输入学号查询（留空显示全部）">
                <button onclick="loadStudents()">查询</button>
            </div>
            <table>
                <thead>
                    <tr>
                        <th>学号</th>
                        <th>姓名</th>
                        <th>年龄</th>
                        <th>年级</th>
                    </tr>
                </thead>
                <tbody id="tableBody">
                    <tr><td colspan="4" style="text-align:center">加载中...</td></tr>
                </tbody>
            </table>
        </div>
    </div>
    <script>
        async function loadStudents() {
            const id = document.getElementById('searchId').value.trim();
            const url = id ? '/api/get-students?studentId=' + encodeURIComponent(id) : '/api/get-students';
            try {
                const res = await fetch(url);
                const data = await res.json();
                const tbody = document.getElementById('tableBody');
                if (!res.ok) {
                    tbody.innerHTML = '<tr><td colspan="4" style="text-align:center;color:#ff3b30">' + (data.error || '查询失败') + '</td></tr>';
                    return;
                }
                const list = Array.isArray(data) ? data : [data];
                if (list.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="4" style="text-align:center">暂无数据</td></tr>';
                    return;
                }
                tbody.innerHTML = list.map(s =>
                    '<tr><td>' + s.id + '</td><td>' + s.name + '</td><td>' + s.age + '</td><td>' + s.grade + '</td></tr>'
                ).join('');
            } catch {
                document.getElementById('tableBody').innerHTML = '<tr><td colspan="4" style="text-align:center;color:#ff3b30">网络错误</td></tr>';
            }
        }
        loadStudents();
    </script>
</body>
</html>
