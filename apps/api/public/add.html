<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>添加学生</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
        }
        .sidebar {
            width: 240px;
            background: rgba(255,255,255,0.15);
            backdrop-filter: blur(20px);
            padding: 30px 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .sidebar a {
            color: white;
            text-decoration: none;
            padding: 12px 16px;
            border-radius: 12px;
            font-size: 15px;
            transition: background 0.2s;
        }
        .sidebar a:hover { background: rgba(255,255,255,0.2); }
        .main {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .card {
            background: rgba(255,255,255,0.2);
            backdrop-filter: blur(20px);
            border-radius: 20px;
            padding: 40px;
            width: 400px;
            color: white;
        }
        .card h2 { margin-bottom: 24px; text-align: center; }
        .form-group { margin-bottom: 16px; }
        .form-group label { display: block; margin-bottom: 6px; font-size: 14px; }
        .form-group input, .form-group select {
            width: 100%;
            padding: 10px 14px;
            border: none;
            border-radius: 10px;
            font-size: 15px;
            outline: none;
        }
        button {
            width: 100%;
            padding: 12px;
            background: white;
            color: #667eea;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 8px;
            transition: transform 0.1s;
        }
        button:active { transform: scale(0.98); }
        .toast {
            position: fixed;
            top: 20px;
            right: 20px;
            padding: 12px 24px;
            border-radius: 10px;
            color: white;
            font-size: 14px;
            display: none;
        }
        .toast.success { background: #34c759; }
        .toast.error { background: #ff3b30; }
    </style>
</head>
<body>
    <nav class="sidebar">
        <a href="/">首页</a>
        <a href="/add.html">添加学生</a>
        <a href="/list.html">学生列表</a>
    </nav>
    <div class="main">
        <div class="card">
            <h2>添加学生</h2>
            <div class="form-group">
                <label>学号</label>
                <input type="text" id="id" placeholder="请输入学号">
            </div>
            <div class="form-group">
                <label>姓名</label>
                <input type="text" id="name" placeholder="请输入姓名">
            </div>
            <div class="form-group">
                <label>年龄</label>
                <input type="number" id="age" placeholder="请输入年龄">
            </div>
            <div class="form-group">
                <label>年级</label>
                <select id="grade">
                    <option value="">请选择年级</option>
                    <option value="大一">大一</option>
                    <option value="大二">大二</option>
                    <option value="大三">大三</option>
                    <option value="大四">大四</option>
                </select>
            </div>
            <button onclick="submitStudent()">提交</button>
        </div>
    </div>
    <div class="toast" id="toast"></div>
    <script>
        function showToast(msg, type) {
            const t = document.getElementById('toast');
            t.textContent = msg;
            t.className = 'toast ' + type;
            t.style.display = 'block';
            setTimeout(() => t.style.display = 'none', 2500);
        }

        async function submitStudent() {
            const data = {
                id: document.getElementById('id').value.trim(),
                name: document.getElementById('name').value.trim(),
                age: parseInt(document.getElementById('age').value) || 0,
                grade: document.getElementById('grade').value
            };
            if (!data.id || !data.name) {
                showToast('学号和姓名不能为空', 'error');
                return;
            }
            try {
                const res = await fetch('/api/submit-student', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });
                const result = await res.json();
                if (res.ok) {
                    showToast('提交成功', 'success');
                } else {
                    showToast(result.error || '提交失败', 'error');
                }
            } catch {
                showToast('网络错误', 'error');
            }
        }
    </script>
</body>
</html>
